<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PayPal Invoice Chat</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#0b1f3a;--mut:#5b6b82;--line:#e1e6ee;--pri:#0070e0;--ok:#0a8a4a;--me:#e3effd;--hl:#fff1b8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1420;--card:#151f30;--ink:#e8eef8;--mut:#93a3bb;--line:#26344b;--pri:#4da3ff;--ok:#3ccf86;--me:#1b3354;--hl:#4a4015;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;padding:16px;max-width:1100px;margin:0 auto}@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.mut{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;margin:12px 0}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.r{text-align:right}
td input{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px}td input:hover,td input:focus{border-color:var(--line);outline:0}td input.a{width:110px;text-align:right}
tr.hl td{animation:f 2.4s ease-out}@keyframes f{0%,40%{background:var(--hl)}100%{background:0 0}}
.tot{margin-left:auto;width:min(270px,100%)}.tot div{display:flex;justify-content:space-between;padding:3px 0}.g{font-weight:800;font-size:18px;border-top:2px solid var(--ink)}
.btn{border:0;border-radius:999px;background:var(--pri);color:#fff;font:inherit;font-weight:600;padding:9px 16px;cursor:pointer}.btn.s{background:transparent;color:var(--ink);border:1px solid var(--line);padding:5px 11px;font-weight:500}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--pri)}
.chat{display:flex;flex-direction:column;height:min(640px,calc(100vh - 40px))}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:8px 12px;border-radius:12px;border:1px solid var(--line);white-space:pre-wrap}.m b{display:block;font-size:11px;color:var(--mut)}.m.me{align-self:flex-end;background:var(--me);border-color:transparent}.m.pp{border-left:3px solid var(--pri)}
.in{display:flex;gap:6px;margin-top:8px}.in input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 14px}
.empty{text-align:center;padding:40px 10px}.x{border:0;background:0;color:var(--mut);cursor:pointer}
</style></head><body><main id="app"></main><script>
const q=new URLSearchParams(location.search),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(!q.get('i')){$('#app').innerHTML='<div class="card empty" style="grid-column:1/-1"><h2>Invoice Chat</h2><p class="mut">Create a thread, then share the firm link it gives you.</p><select id="c"><option>USD</option><option>INR</option></select> <button class="btn" id="mk">Create invoice thread</button></div>';
 $('#mk').onclick=async()=>{const r=await(await fetch('/api/invoices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cur:$('#c').value})})).json();location.href=r.seller}}
else{let S,prev={};const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?i='+q.get('i')+'&t='+q.get('t')),send=o=>ws.send(JSON.stringify(o));
 ws.onmessage=e=>{S=JSON.parse(e.data);render()};ws.onclose=()=>$('#app').insertAdjacentHTML('afterbegin','<p class="mut">Disconnected. Reload.</p>');
 const fmt=n=>new Intl.NumberFormat(S.inv.cur==='INR'?'en-IN':'en-US',{style:'currency',currency:S.inv.cur}).format(n);
 function render(){const I=S.inv,sel=S.role==='seller',ed=sel&&I&&I.status!=='paid',keep=document.activeElement?.id==='t'?$('#t').value:'';
  let sub=0,d=0,tx=0;if(I){sub=I.items.reduce((s,i)=>s+i.amt,0);d=I.disc?(I.disc.t==='pct'?sub*I.disc.v/100:I.disc.v):0;tx=I.tax?(sub-d)*I.tax.r/100:0}
  const L=I?`<div style="display:flex;justify-content:space-between"><div><h2 style="margin:0">${esc(I.no)}</h2><div class="mut">Bill to <b>${esc(I.firm||'(not set)')}</b> ${esc(I.email)} · due in ${I.due} days · v${I.ver}</div></div><span class="pill">${I.status}</span></div>
  <table><tr><th>Item</th><th class="r">Amount</th>${ed?'<th></th>':''}</tr>${I.items.map(i=>`<tr class="${prev[i.id]!==undefined&&prev[i.id]!==i.amt+i.desc||(Object.keys(prev).length&&prev[i.id]===undefined)?'hl':''}"><td>${ed?`<input data-id="${i.id}" data-f="description" value="${esc(i.desc)}">`:esc(i.desc)}</td><td class="r">${ed?`<input class="a" type="number" step="any" data-id="${i.id}" data-f="amount" value="${i.amt}">`:fmt(i.amt)}</td>${ed?`<td><button class="x" data-rm="${i.id}">✕</button></td>`:''}</tr>`).join('')}</table>
  <div class="tot"><div><span>Subtotal</span><span>${fmt(sub)}</span></div>${I.disc?`<div><span>Discount</span><span>−${fmt(d)}</span></div>`:''}${I.tax?`<div><span>${esc(I.tax.n)} ${I.tax.r}%</span><span>${fmt(tx)}</span></div>`:''}<div class="g"><span>Total</span><span>${fmt(sub-d+tx)}</span></div></div>
  <div class="act">${sel?(I.status==='draft'?'<button class="btn" id="snd">Send from PayPal</button>':'')+(S.firmLink?`<button class="btn s" id="cp">Copy firm link</button>`:''):(I.status==='sent'?'<button class="btn" id="ap">Approve</button>':'')+(['sent','approved'].includes(I.status)&&!S.live?'<button class="btn s" id="pay">Pay (mock)</button>':'')}</div>
  <p class="mut">${S.hist.length?'History: '+S.hist.slice(-3).map(h=>`v${h.v} ${esc(h.s.join(', '))}`).join(' → '):''}</p>`:'<div class="empty mut">The seller hasn’t sent an invoice yet.</div>';
  $('#app').innerHTML=`<section class="card">${L}</section><section class="card chat"><div class="msgs" id="ms">${S.msgs.map(m=>`<div class="m ${m.who===S.role?'me':''} ${m.who==='pp'?'pp':''}"><b>${m.who==='pp'?'PayPal':m.who}</b>${esc(m.text)}${m.prop?(m.prop.state==='open'?(sel?`<div class="act"><button class="btn s" data-y="${m.id}">Approve change</button><button class="btn s" data-n="${m.id}">Decline</button></div>`:'<div class="mut">Waiting for seller…</div>'):`<div class="mut">${m.prop.state==='done'?'Applied':'Declined'}</div>`):''}</div>`).join('')}</div>
  <div class="in"><input id="t" placeholder="@PayPal add 3k for installation…" autocomplete="off" value="${esc(keep)}"><button class="btn" id="go">Send</button></div></section>`;
  $('#ms').scrollTop=1e9;prev={};I?.items.forEach(i=>prev[i.id]=i.amt+i.desc);
  const go=()=>{const v=$('#t').value.trim();if(v){send({type:'chat',text:v});$('#t').value=''}};$('#go').onclick=go;$('#t').onkeydown=e=>e.key==='Enter'&&go();
  for(const[id,f]of[['snd',{type:'send'}],['ap',{type:'approve'}],['pay',{type:'pay'}]])$('#'+id)&&($('#'+id).onclick=()=>send(f));
  $('#cp')&&($('#cp').onclick=()=>navigator.clipboard.writeText(location.origin+S.firmLink));}
 document.addEventListener('change',e=>{const el=e.target,id=el.dataset.id;if(id)send({type:'edit',id,[el.dataset.f]:el.dataset.f==='amount'?parseFloat(el.value):el.value})});
 document.addEventListener('click',e=>{const d=e.target.dataset;if(d.rm)send({type:'remove',id:d.rm});if(d.y)send({type:'decide',id:d.y,accept:true});if(d.n)send({type:'decide',id:d.n,accept:false})})}
</script></body></html>
